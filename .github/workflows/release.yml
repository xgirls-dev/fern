name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: false
        default: ""
      stage_only:
        description: Build and upload packages to a draft for installer testing
        type: boolean
        default: false
      tested_windows_sha256:
        description: Publish the staged release with this tested Windows installer SHA-256
        type: string
        default: ""

permissions:
  contents: write

jobs:
  windows-installer:
    if: >-
      !inputs.tested_windows_sha256 &&
      (github.event_name != 'push' ||
      startsWith(github.ref_name, 'v') ||
      contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install --upgrade pip
      # Install the complete lock directly: Optimum Intel's branch URL conflicts
      # with our exact commit URL for the same Optimum ONNX source.
      - run: .venv/Scripts/python.exe -m pip install --no-deps -r requirements-release.txt
      - run: .venv/Scripts/python.exe -m pip check
      - name: Use release virtualenv
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.venv\Scripts"
      - name: Verify Electron app and backend integration
        run: npm run test:electron --workspace @fern/desktop
      - name: Verify renderer workflows and layouts
        run: npm run test:ui
      - run: npm run check
      - run: npm run package
      - name: Verify packaged application and first-run runtime
        shell: pwsh
        run: |
          $env:FERN_E2E_EXECUTABLE = Join-Path $PWD 'apps\desktop\release\win-unpacked\Fern.exe'
          node apps/desktop/e2e/smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw "Packaged Fern smoke test failed." }
      - name: Upload installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          STAGE_ONLY: ${{ inputs.stage_only }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "apps/desktop/release" -Recurse -Filter "Fern-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            $found = @(Get-ChildItem -Path "apps/desktop/release" -Recurse -File | Select-Object -ExpandProperty FullName)
            throw "Expected exactly one Fern-Setup-*.exe, found $($installers.Count). Files: $($found -join '; ')"
          }
          $installer = $installers[0]
          if ($installer.Length -le 0) { throw "Installer is empty: $($installer.FullName)" }

          $package = Get-Content -Raw "package.json" | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TAG) {
            $tag = $env:RELEASE_TAG
          } else {
            $tag = "v$($package.version)"
          }

          $version = $tag -replace '^v', ''
          $changelog = Get-Content -Raw "CHANGELOG.md"
          $escapedVersion = [regex]::Escape($version)
          $notesPattern = "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $notesMatch = [regex]::Match($changelog, $notesPattern)
          if (-not $notesMatch.Success -or [string]::IsNullOrWhiteSpace($notesMatch.Groups[1].Value)) {
            throw "CHANGELOG.md must contain a non-empty section for [$version] before publishing $tag."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "fern-release-notes.md"
          Set-Content -Path $notesPath -Value $notesMatch.Groups[1].Value.Trim() -Encoding utf8NoBOM

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:STAGE_ONLY -eq 'true') {
              $draft = gh release view $tag --json isDraft,targetCommitish | ConvertFrom-Json
              if (-not $draft.isDraft -or $draft.targetCommitish -ne $env:GITHUB_SHA) {
                throw "Expected a draft for $tag targeting $env:GITHUB_SHA."
              }
            }
            gh release upload $tag $installer.FullName --clobber
          } elseif ($env:STAGE_ONLY -eq 'true') {
            gh release create $tag --draft --target $env:GITHUB_SHA --notes-file $notesPath $installer.FullName
          } else {
            gh release create $tag $installer.FullName --notes-file $notesPath --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload/create failed for $tag." }

          # Keep release notes curated from CHANGELOG.md when rebuilding an existing tag too.
          gh release edit $tag --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "GitHub release notes update failed for $tag." }

          $releaseAssets = @(gh release view $tag --json assets --jq '.assets[] | select(.name | startswith("Fern-Setup-")) | .name')
          if ($releaseAssets.Count -ne 1) {
            throw "Expected exactly one Fern installer on release $tag, found $($releaseAssets.Count)."
          }
          Write-Host "Uploaded $($releaseAssets[0]) to release $tag."

  omarchy-package:
    if: >-
      !inputs.tested_windows_sha256 &&
      (github.event_name != 'push' ||
      startsWith(github.ref_name, 'v') ||
      contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          persist-credentials: false
      - name: Build and verify the Omarchy package on Arch Linux
        run: |
          mkdir -p "$RUNNER_TEMP/fern-omarchy"
          docker run --rm \
            -v "$PWD:/source:ro" \
            -v "$RUNNER_TEMP/fern-omarchy:/output" \
            archlinux:base-devel bash -euo pipefail -c '
              pacman -Syu --needed --noconfirm git nodejs npm uv dbus xorg-server-xvfb xorg-xauth
              useradd --create-home --user-group builder
              mkdir /home/builder/fern
              tar -C /source --exclude=.git -cf - . | tar -C /home/builder/fern -xf -
              chown -R builder:builder /home/builder/fern
              cd /home/builder/fern
              runuser -u builder -- npm ci
              runuser -u builder -- npm run package:omarchy
              package=(apps/desktop/release-omarchy/fern-*.pkg.tar.zst)
              test "${#package[@]}" -eq 1
              test -s "${package[0]}"
              pacman -U --noconfirm "${package[0]}"
              python=/opt/fern/resources/runtime/python-home/bin/python3.12
              runuser -u builder -- "$python" -B -m unittest discover -s tests -p "test_*.py"
              runuser -u builder -- env FERN_E2E_EXECUTABLE=/usr/bin/fern FERN_E2E_VISIBLE=1 \
                dbus-run-session -- xvfb-run -a node apps/desktop/e2e/smoke.mjs
              install -m644 "${package[0]}" /output/
            '
      - uses: actions/upload-artifact@v4
        with:
          name: fern-omarchy
          path: ${{ runner.temp }}/fern-omarchy/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-omarchy:
    needs: [windows-installer, omarchy-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fern-omarchy
          path: release-omarchy
      - name: Add the Omarchy package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=${RELEASE_TAG:-v$(jq -r .version package.json)}
          fi
          package=(release-omarchy/fern-*.pkg.tar.zst)
          test "${#package[@]}" -eq 1
          test -s "${package[0]}"
          gh release upload "$tag" "${package[0]}" --clobber

  publish-tested-release:
    if: github.event_name == 'workflow_dispatch' && !inputs.stage_only && inputs.tested_windows_sha256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish the tested draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TESTED_SHA256: ${{ inputs.tested_windows_sha256 }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          tag="v$version"
          [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == "$tag" ]]
          [[ "$TESTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          release=$(gh release view "$tag" --json isDraft,targetCommitish,assets)
          jq -e --arg commit "$GITHUB_SHA" \
            --arg windows "Fern-Setup-$version.exe" \
            --arg linux "fern-$version-1-x86_64.pkg.tar.zst" \
            --arg digest "sha256:${TESTED_SHA256,,}" '
            .isDraft and .targetCommitish == $commit and
            (.assets | length == 2) and
            any(.assets[]; .name == $windows and .digest == $digest and .size > 0) and
            any(.assets[]; .name == $linux and .size > 0 and (.digest | startswith("sha256:")))
          ' <<< "$release" > /dev/null
          gh release edit "$tag" --draft=false --latest
