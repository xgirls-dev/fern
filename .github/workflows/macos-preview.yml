name: macOS preview

on:
  workflow_dispatch:
    inputs:
      gpu_smoke:
        description: Run real Metal and MLX inference with downloaded models
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/macos-preview.yml
      - scripts/gguf_runtime.py
      - apps/desktop/e2e/gguf-smoke.mjs
      - apps/desktop/e2e/macos-gpu-smoke.py

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-macos-preview]')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.title, '[test-macos-gpu]'))
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: command -v uv || brew install uv
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:macos
      - name: Check signature and Finder app startup
        run: |
          app_path=apps/desktop/release-macos/mac-arm64/Fern.app
          codesign --verify --deep --strict "$app_path"
          FERN_E2E_EXECUTABLE="$PWD/$app_path/Contents/MacOS/Fern" node apps/desktop/e2e/macos-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fern-macos-arm64-preview
          path: apps/desktop/release-macos/Fern-*-macOS-arm64-preview.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  gpu-smoke:
    if: >-
      inputs.gpu_smoke || contains(github.event.head_commit.message, '[test-macos-gpu]') ||
      github.event_name == 'pull_request'
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: fern-macos-arm64-preview
          path: ${{ runner.temp }}/fern-preview
      - name: Run first chat, Stop, and follow-up in the packaged app
        run: |
          preview="$RUNNER_TEMP/fern-preview"
          ditto -x -k "$preview"/Fern-*-macOS-arm64-preview.zip "$preview"
          FERN_E2E_EXECUTABLE="$preview/Fern.app/Contents/MacOS/Fern" \
            FERN_E2E_TEXT_MODEL_ROOT="$preview/models/text" \
            FERN_E2E_ARTIFACTS="$preview/proof" \
            node apps/desktop/e2e/gguf-smoke.mjs
      - name: Run GPU inference with the packaged runtime
        run: |
          preview="$RUNNER_TEMP/fern-preview"
          app="$preview/Fern.app"
          FERN_TEXT_MODEL_ROOT="$preview/models/text" \
            "$app/Contents/Resources/runtime/python-home/bin/python3.12" -B \
              apps/desktop/e2e/macos-gpu-smoke.py "$app" "$preview/proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fern-macos-gpu-proof
          path: ${{ runner.temp }}/fern-preview/proof
          retention-days: 7

  publish:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-macos-preview:')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Publish the verified Apple Silicon package
        run: |
          set -euo pipefail
          [[ "$PUBLISH_MESSAGE" =~ \[publish-macos-preview:([0-9]+)\] ]]
          run_id="${BASH_REMATCH[1]}"
          run=$(gh run view "$run_id" --json headSha,headBranch,workflowName,conclusion,jobs)
          passed=$(jq -r '
            .headBranch == "main" and .workflowName == "macOS preview" and .conclusion == "success"
            and ([.jobs[] | select(.conclusion == "success") | .name] | sort == ["build", "gpu-smoke"])
          ' <<< "$run")
          test "$passed" = true
          tested_sha=$(jq -r '.headSha' <<< "$run")
          # The Actions token can tag the current commit. Only publish if the
          # app sources still match the verified build.
          unchanged=$(gh api "repos/$GH_REPO/compare/$tested_sha...$GITHUB_SHA" --jq '
            .status == "ahead" and all(.files[];
              .filename == "README.md" or .filename == ".github/workflows/macos-preview.yml")
          ')
          test "$unchanged" = true

          cd "$RUNNER_TEMP"
          gh run download "$run_id" --name fern-macos-arm64-preview
          packages=(Fern-*-macOS-arm64-preview.zip)
          test "${#packages[@]}" = 1
          package="${packages[0]}"
          test -f "$package"
          version=${package#Fern-}
          version=${version%-macOS-arm64-preview.zip}
          tag="v$version-macos-preview.1"
          sha256sum "$package" > "$package.sha256"

          cat > macos-preview-notes.md <<EOF
          Fern's first Apple Silicon preview runs on M-series Macs with macOS 15 or later. It includes Gemma 4 E4B chat and vision on Metal and Klein 4B image generation on MLX.

          1. Download and extract **$package**, then move Fern.app to Applications.
          2. Open Fern. If macOS blocks the first launch, go to **System Settings → Privacy & Security → Open Anyway**. This preview uses an ad-hoc signature and is unnotarized. [Apple's first-launch instructions](https://support.apple.com/en-us/102445)
          3. In **Models**, install **Gemma 4 E4B · GGUF** and **Klein 4B · MLX**. Allow about 10 GB for both model downloads and extra space for caches and outputs.

          The [GPU test](https://github.com/$GH_REPO/actions/runs/$run_id) passed chat, vision, 512 × 512 image generation, and a chat turn that generated, inspected, and retained a fox image. Performance on a physical Mac still needs testing. This preview covers chat, vision, and text-to-image.
          EOF

          gh release create "$tag" "$package" "$package.sha256" \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Fern for Mac · Apple Silicon Preview 1" --notes-file macos-preview-notes.md
