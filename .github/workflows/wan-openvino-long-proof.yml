name: Wan OpenVINO longer export proof

on:
  push:
    branches: [codex/wan-openvino-full-resolution-proof]

permissions:
  contents: read

jobs:
  render-with-existing-export:
    name: Render ${{ matrix.seconds }} seconds at 544 × 704
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        seconds: [4, 10]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned CPU runtime
        run: |
          python -m pip install 'torch==2.7.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'openvino==2026.4.0' 'nncf==3.4.0' 'diffusers==0.35.0' 'transformers==4.49.0' 'huggingface_hub==0.36.0' Pillow imageio imageio-ffmpeg ftfy regex
      - name: Generate the full-resolution clip with the OpenVINO model and upstream Wan decoder
        run: /usr/bin/time -v python -u wan-openvino-long-proof.py ${{ matrix.seconds }}
      - name: Verify the encoded clip
        env:
          SECONDS_TO_RENDER: ${{ matrix.seconds }}
        run: |
          ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=width,height,avg_frame_rate,nb_read_frames \
            -of json proof/wan-openvino.mp4 > proof/encoded.json
          python - <<'PY'
          import json, os
          expected = int(os.environ["SECONDS_TO_RENDER"]) * 16 + 1
          with open("proof/encoded.json") as file:
              stream = json.load(file)["streams"][0]
          assert (stream["width"], stream["height"]) == (544, 704), stream
          assert stream["avg_frame_rate"] == "16/1", stream
          assert int(stream["nb_read_frames"]) == expected, stream
          print(stream)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-openvino-full-resolution-${{ matrix.seconds }}s
          path: proof/
          if-no-files-found: warn
          retention-days: 3
