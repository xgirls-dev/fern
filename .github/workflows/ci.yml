name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify GGUF runtime and cancellation
        run: |
          python -m pip install defusedxml==0.7.1
          python -m unittest discover -s tests -p test_gguf_runtime.py
      - run: npm ci
      - name: Verify renderer workflows and layouts
        run: npm run test:ui
      - run: npm run typecheck
      - run: npm run check:python
      - name: Verify chat context fitting
        run: python -m unittest discover -s tests -p test_chat_context.py
      - name: Verify worker cleanup after a desktop service exit
        run: python -m unittest discover -s tests -p test_windows_service_job.py
      - name: Verify workspace backup archives
        run: python -m unittest discover -s tests -p test_workspace_backup.py
      - run: npm run build
